name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create version.json
        run: |
          printf '{"commit":"%s","version":"%s","source":"%s/%s","build":"local"}' \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            > version.json

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Create version.json
        run: |
          printf '{"commit":"%s","version":"%s","source":"%s/%s","build":"local"}' \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            > version.json

      - name: Build Docker image
        run: docker build -t shavar:${{ github.sha }} .
