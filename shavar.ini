###
# app configuration
# http://docs.pylonsproject.org/projects/pyramid/en/1.5-branch/narr/environment.html
###

[app:main]
use = egg:shavar


[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = DEBUG
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
class = mozsvc.util.JsonLogFormatter

[mozsvc]
dont_fuzz = True

[shavar]
default_proto_ver = 2.0
lists_served = dir://shavar/tests/lists_served
lists_root = tests
redirect_url_base = http://localhost:8000/data
